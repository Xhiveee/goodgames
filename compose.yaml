services:
  web:
    build:
      context: .
      target: web
      args:
        VITE_SLITHER_SERVER_URL: ${VITE_SLITHER_SERVER_URL}
    restart: unless-stopped
    depends_on:
      slither:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  slither:
    build:
      context: .
      target: arena
    restart: unless-stopped
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
